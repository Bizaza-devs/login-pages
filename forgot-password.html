<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Login page demo</title>
  <meta name="description" content="Minimal forgot-password page in plain HTML, CSS and JavaScript. Front-end demo: nothing is sent or stored.">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="minimal.css">
</head>
<body>
  <main aria-labelledby="title">
    <p class="eyebrow">Account</p>
    <h1 id="title">Reset password</h1>
    <p class="lead">Enter your email and we will send you a reset link.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-err">
        <p class="err" id="email-err" role="alert"></p>
      </div>
      <button class="btn" type="submit" id="submit">Send reset link</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="alt"><a href="index.html">Back to sign in</a></p>
    <p class="note">Front-end demo only. No email is sent and nothing is checked against a server.</p>
  </main>
  <script src="common.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
