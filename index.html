<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Login page demo</title>
  <meta name="description" content="A small, accessible login page built with plain HTML, CSS and JavaScript. Front-end demo: nothing is sent or stored.">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" aria-labelledby="title">
    <header class="head">
      <div class="logo" aria-hidden="true">B</div>
      <h1 id="title">Welcome back</h1>
      <p class="sub">Sign in to continue to your workspace.</p>
    </header>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" required aria-describedby="email-err">
        <p class="err" id="email-err" role="alert"></p>
      </div>

      <div class="field">
        <div class="row">
          <label for="password">Password</label>
          <a class="link" href="forgot-password.html" id="forgot">Forgot password?</a>
        </div>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required minlength="8" aria-describedby="pw-err">
          <button type="button" id="toggle" class="toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p class="err" id="pw-err" role="alert"></p>
      </div>

      <label class="check"><input type="checkbox" id="remember"> <span>Keep me signed in</span></label>

      <button class="btn" type="submit" id="submit">Sign in</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="foot">No account? <a class="link" href="create-account.html" id="signup">Create one</a></p>
    <p class="note">Front-end demo only. Nothing you type is sent, stored or checked against a server.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
