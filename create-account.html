<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Login page demo</title>
  <meta name="description" content="Minimal create-account page in plain HTML, CSS and JavaScript. Front-end demo: nothing is sent or stored.">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="minimal.css">
</head>
<body>
  <main aria-labelledby="title">
    <p class="eyebrow">Account</p>
    <h1 id="title">Create account</h1>
    <p class="lead">It takes less than a minute.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your name" required aria-describedby="name-err">
        <p class="err" id="name-err" role="alert"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-err">
        <p class="err" id="email-err" role="alert"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" aria-describedby="pw-hint pw-err">
          <button type="button" id="toggle" class="toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p class="hint" id="pw-hint">Strength: <span id="strength">–</span></p>
        <p class="err" id="pw-err" role="alert"></p>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat the password" required aria-describedby="confirm-err">
        <p class="err" id="confirm-err" role="alert"></p>
      </div>
      <label class="check"><input type="checkbox" id="terms" aria-describedby="terms-err"> <span>I agree to the terms of use</span></label>
      <p class="err" id="terms-err" role="alert" style="margin-top:-18px;margin-bottom:18px"></p>
      <button class="btn" type="submit" id="submit">Create account</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="alt">Already have an account? <a href="index.html">Sign in</a></p>
    <p class="note">Front-end demo only. Nothing you type is sent, stored or checked against a server.</p>
  </main>
  <script src="common.js"></script>
  <script src="create-account.js"></script>
</body>
</html>
